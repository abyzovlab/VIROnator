project: ""

# ==============================================================================
# COMMON / JOINT VARIABLES (Global parameters used across modules)
# ==============================================================================
data_dir: "/mnt/disks/lab"
# Note: data_subdir is ONLY needed for Modules 0, 1, and 2 (Human Alignment, Coverage Calculation, Unmapped Extraction).
# Downstream modules (Module 3 Viral Alignment, Module 4 Reporting, etc.) do NOT use data_subdir.
# data_subdir: "tertiary/SSC_hg38/WGS"  # Middle subdirectory path inside data_dir (set to "" for flat datasets)
data_subdir: "whole_genome/bb1000_2013/raw/bam"
# data_subdir: "tertiary/s203958.TS_mosaicism/integrated/raw_data/BSMN_download"
# data_subdir: "tertiary/s203958.TS_mosaicism/integrated/raw_data/1000G_2504_high_coverage"
# data_subdir: "fromNorgan/data"
# data_subdir: "fromNorgan_hg38_human_alignment"
input_keyword: ""                      # Optional middle keyword after sample dot (e.g. "final", "sorted", or "" for none)
input_suffix: "bam"                    # File extension after keyword (e.g. "cram", "bam")
output_dir: "/mnt/disks/staff"
work_dir: "."  # Current VIROnator execution directory
placeholder_file: "test.txt"

# Google Cloud Storage (GCS) Buckets
# - data_bucket: Source GCS bucket where raw CRAM files are stored (mounts to /mnt/disks/lab)
# - output_bucket: Destination GCS bucket where outputs are deposited (mounts to /mnt/disks/staff)
data_bucket: "ml-phi-abyzov-alexej-m124423-rsa-us-central1-p-d3c4"
# data_bucket: "ml-phi-mcbiobank-rsa-us-central1-p-88af"
# data_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4" # staff bucket
output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"

# GCP Service Account & Billing Parameters
gcp_account: "vaults6-m277455-p-1733249128@ml-fpt-rsa-aproject1-p-581c.iam.gserviceaccount.com"
pi: "MDJ"
pau: 0
task_name: "mdj_test"
machine_type: "n2-standard-128"  # GCP Instance type (e.g. n1-standard-4, n2-standard-8, n2-standard-16)
threads: 128                     # CPU threads per worker node
memory: 512                      # Memory (RAM) in GB per worker node
nodes: 11000                     # Max node count
storage: 6000                      # Additional persistent storage in GB
boot_storage: 250                # Boot storage in GB

# GCS output folder names (located inside output_dir)
unmapped_out_dirname: "{dataset}_{genome_build}_unmapped"
vironator_out_dirname: "{dataset}_{genome_build}_vironator"
reports_out_dirname: "{dataset}_{genome_build}_reports"
coverage_out_dirname: "{dataset}_{genome_build}_coverage"
human_alignment_out_dirname: "{dataset}_{genome_build}_human_alignment"
kraken_out_dirname: "{dataset}_{genome_build}_kraken"

# Jobexec orchestrator folder names (located in output_bucket)
unmapped_jobexec_dirname: "jobexec_unmapped_{dataset}_{genome_build}"
vironator_jobexec_dirname: "jobexec_vironator_{dataset}_{genome_build}"
reporting_jobexec_dirname: "jobexec_reporting_{dataset}_{genome_build}"
coverage_jobexec_dirname: "jobexec_coverage_{dataset}_{genome_build}"
human_alignment_jobexec_dirname: "jobexec_human_alignment_{dataset}_{genome_build}"
kraken_jobexec_dirname: "jobexec_kraken_{dataset}_{genome_build}"

# Path to the sample metadata list.
# - If you specify a RELATIVE path (e.g., "samples_p2_base"), Snakemake dynamically 
#   appends it to the "work_dir" configured above (e.g. work_dir/samples_p2_base).
# - If your samples file is stored elsewhere, you MUST provide an ABSOLUTE path 
#   starting with a "/" (e.g. "/home/user/working/samples_p2_base") to bypass 
#   automatic appending.
# samples_list: "samples_panviral.txt"
# samples_list: "samples_hpv.txt"
# samples_list: "samples_SSC_all.txt"
# samples_list: "samples_mayo_biobank.txt"
samples_list: "samples_p4_clean_base"
# samples_list: "samples_1000GP.txt"
# samples_list: "samples_WGS.TS.Vaccarino"
# samples_list: "samples_WGS.SCZ.Weinberger"
# samples_list: "samples_WGS.SCZ.Chess"
# samples_list: "samples_WGS.NC.Gleeson"
# samples_list: "samples_WGS.ASD.Walsh"

# Base directory for all external reference genomes (GCS mount)
ref_dir: "/mnt/disks/staff/refs"

# Repository directory containing helper scripts (GCS shared mount)
scripts_dir: "/mnt/disks/staff/scripts"


# ==============================================================================
# MODULE 0A: HUMAN GENOME ALIGNMENT (FASTQ -> CRAM via BWA-MEM)
# ==============================================================================
human_alignment_module: "off"             # Master switch: "on" or "off"
human_alignment_script: "ssc_human_alignment.job"

# Reference Genome:
human_align_ref: "/mnt/disks/staff/refs/GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa"
# Alternatively unmodified GRCh38:
# human_align_ref: "/mnt/disks/staff/refs/GRCh38_full_analysis_set_plus_decoy_hla.fa"

# Input FASTQ Extension & Naming Patterns (Supports {sample} and {suffix}):
# For files like: 10_L001_R1_001.fastq.gz, explicitly includes '001' to avoid confusion with other labels.
# Anchored by '{sample}_' so sample 1 never collides with sample 10, 19, or 100.
fastq_suffix: "fastq.gz"
fastq_r1_pattern: "{sample}_L001_R1_001.{suffix}"
# fastq_r1_pattern: "{sample}_L1_R1.{suffix}"
fastq_r2_pattern: "{sample}_L001_R2_001.{suffix}"
# fastq_r2_pattern: "{sample}_L1_R2.{suffix}"

# Directory & Bucket Settings for Norgan Dataset:
# dataset: "fromNorgan"
# genome_build: "hg38"
# phase: "panviral"  # or "hpv" (or specify in sample list as panviral+sample_id)
# project: ""
# data_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"       # Input FASTQs bucket (mounts to data_dir)
# output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"     # Destination CRAM bucket (mounts to output_dir)
# data_dir: "/mnt/disks/lab"
# data_subdir: "fromNorgan/data"                                      # FASTQs located in data_subdir/phase
# output_dir: "/mnt/disks/staff"
# human_alignment_out_dirname: "{dataset}_{genome_build}_human_alignment"
# human_alignment_jobexec_dirname: "jobexec_human_alignment_{dataset}_{genome_build}"


# ==============================================================================
# MODULE 0B: KRAKEN2 TAXONOMIC CLASSIFICATION MODULE (kraken2/2.1.2)
# ==============================================================================

# ------------------------------------------------------------------------------
# SUBMODULE 0B.1: KRAKEN2 CUSTOM DATABASE BUILD (Single Worker VM Job)
# Builds a custom Kraken2 v2.1.2 hash table on a dedicated GCP VM.
# Inherits machine_type, threads, memory, nodes, storage, and boot_storage from header.
# ------------------------------------------------------------------------------
kraken_build_submodule: "off"             # Switch: "on" or "off" to compile ssc_kraken_build.job & config
kraken_build_script: "ssc_kraken_build.job"
kraken_build_jobexec_dirname: "jobexec_kraken_build_{dataset}_{genome_build}"
kraken_build_task_name: "kraken2_db_build"
kraken_build_exec_threads: 32             # CPU threads for kraken2-build execution

# Input GCS Paths for Reference FASTA and NCBI Taxonomy:
kraken_build_source_fasta: "gs://ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4/refs/combined_GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified.renamed_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified.fa"
kraken_build_taxonomy_gcs: "gs://ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4/refs/kraken_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified/taxonomy"

# Local Working Directory on Attached Disk & Target GCS Upload Destination:
kraken_build_db_dir: "/mnt/disks/staff/refs/kraken_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified"
kraken_build_dest_gcs: "gs://ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4/refs/kraken_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified"

# ------------------------------------------------------------------------------
# SUBMODULE 0B.2: KRAKEN2 SAMPLE PROFILING & TAXONOMIC QUANTIFICATION
# Runs k-mer taxonomic classification directly on raw sequencing reads prior to coverage
# ------------------------------------------------------------------------------
kraken_profiling_submodule: "off"         # Switch: "on" or "off" to run Kraken2 batch profiling job
kraken_module: "off"                      # Alias switch (kept for backward compatibility)
kraken_script: "ssc_kraken.job"

# Pre-built Kraken2 Database Directory (stored on staff GCS mount)
# Built from combined Human Viral reference + SnapGene plasmids + mouse
kraken_db: "/mnt/disks/staff/refs/kraken_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified"

# Computational Resources & Binary Resolution
# Inherits machine_type & threads from header (or set kraken_threads to override)
# Cluster module path: /usr/local/biotools/kraken2/2.1.2/bin/kraken2
# Worker VM mount path: /mnt/disks/staff/bin/kraken2
kraken_bin: "kraken2"                     # Executable name, /mnt/disks/staff/bin/kraken2, or /usr/local/biotools/kraken2/2.1.2/bin/kraken2
kraken_confidence: 0.0                    # Confidence score threshold (0.0 - 1.0, default 0.0)
kraken_quick_mode: "off"                  # "on" to run quick mode (-q)
kraken_memory_mapping: "off"              # "on" to avoid loading whole DB into RAM
kraken_save_classified_reads: "off"       # "on" to save per-read classified output, "off" for report only

# Input FASTQ Extension & Naming Patterns (Supports {sample} and {suffix}):
# Inherits data_dir and data_subdir from header variables.
fastq_suffix: "fastq.gz"
fastq_r1_pattern: "{sample}_L001_R1_001.{suffix}"
# fastq_r1_pattern: "{sample}_L1_R1.{suffix}"
fastq_r2_pattern: "{sample}_L001_R2_001.{suffix}"
# fastq_r2_pattern: "{sample}_L1_R2.{suffix}"



# ==============================================================================
# MODULE 1: COVERAGE CALCULATION MODULE (WGS Human Genome Read Depth)
# ==============================================================================
coverage_module: "off"  # Switch: "on" or "off" to run coverage calculation job

# Header Variables Used in Coverage Calculation:
# - dataset: "SSC"
# - genome_build: "hg38"
# - phase: ""                                                        # Set to "" if phase is specified in sample list tokens (e.g. 1+SSC+sample)
# - project: ""                                                      # Set to "" if project is specified in sample list tokens
# - data_bucket: "ml-phi-abyzov-alexej-m124423-rsa-us-central1-p-d3c4" # Source CRAM/BAM bucket (mounts to data_dir)
# - output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"     # Destination coverage TSVs bucket (mounts to output_dir)
# - data_dir: "/mnt/disks/lab"
# - data_subdir: "tertiary/SSC_hg38/WGS"                             # Middle subdirectory inside data_dir where CRAM/BAM files reside
# - input_keyword: "final"                                           # Middle keyword (e.g. "final" for sample.final.cram, or "" if none)
# - input_suffix: "cram"                                             # Alignment file format ("cram" or "bam")
# - output_dir: "/mnt/disks/staff"
# - coverage_out_dirname: "{dataset}_{genome_build}_coverage"        # Output coverage directory (defined in header)
# - coverage_jobexec_dirname: "jobexec_coverage_{dataset}_{genome_build}" # Jobexec orchestration directory (defined in header)
# - samples_list: "samples_SSC_hg38_extended.txt"                    # Sample list containing SAMPLE or PHASE+PROJECT+SAMPLE tokens

# Input Raw Metadata File (stored directly in ref_dir /mnt/disks/staff/refs/)
# Note: All metadata columns present in this file are automatically transferred into the coverage TSV
# and downstream sample viral reports without needing individual toggle switches.
# Matching is performed cumulatively on sample ID, phase, and project to avoid duplicate ID collisions.
raw_metadata_file: "{dataset}_{genome_build}_metadata.tsv"  # Filename of raw metadata file in ref_dir (e.g. SSC_hg38_comprehensive_metadata.tsv)
metadata_separator: "tab"                                   # File delimiter: "tab" (\t), "comma" (,), or "auto"
sample_id_column: "sample"                                  # Name of Sample ID column in raw_metadata_file (e.g. "sample" or "sscID")
phase_column: "phase"                                       # Name of Phase column in raw_metadata_file (e.g. "phase")
project_column: "project"                                   # Name of Project column in raw_metadata_file (e.g. "project")


# ==============================================================================
# MODULE 2: UNMAPPED EXTRACTION MODULE (Phase 1 CRAM Candidate Extraction)
# ==============================================================================
unmapped_extraction: "off"  # Switch: "on" or "off" to run/skip Phase 1 extraction

# Extraction References (Original reference FASTA used to decode CRAM files)
ref_cram_decoder: "/mnt/disks/staff/refs/GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa"
# ref_cram_decoder: "/mnt/disks/staff/refs/hs37d5.fa"

# Directory & Bucket Settings for Norgan Dataset:
# dataset: "fromNorgan"
# genome_build: "hg38"
# phase: "panviral"  # or "hpv" (or specify in sample list as panviral+sample_id)
# project: ""
# data_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"       # Input CRAM bucket (staff bucket mounted to data_dir)
# output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"     # Destination unmapped CRAM bucket
# data_dir: "/mnt/disks/staff"                                       # or /mnt/disks/lab if mounting staff bucket as data_bucket
# data_subdir: "fromNorgan_hg38_human_alignment"                     # CRAMs located in data_subdir/phase
# input_keyword: ""
# input_suffix: "cram"
# output_dir: "/mnt/disks/staff"
# unmapped_out_dirname: "{dataset}_{genome_build}_unmapped"
# unmapped_jobexec_dirname: "jobexec_unmapped_{dataset}_{genome_build}"


# ==============================================================================
# MODULE 3: VIRAL DB ALIGNMENT MODULE (VIROnator)
# ==============================================================================
viral_db_alignment: "off"  # Switch: "on" or "off"
contamination_quantification: "off"  # Switch: "on" to blacklist plasmid/mouse reads from viral BAM & output 3-column .count TSVs

# Header Variables Used in Viral DB Alignment (VIROnator):
# - dataset: "SSC"
# - genome_build: "hg38"
# - phase: ""                                                        # Set to "" if phase is specified in sample list tokens (e.g. 1+SSC+sample)
# - project: ""                                                      # Set to "" if project is specified in sample list tokens
# - output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"     # Destination bucket for viral alignment CRAMs (mounts to output_dir)
# - output_dir: "/mnt/disks/staff"
# - unmapped_out_dirname: "{dataset}_{genome_build}_unmapped"        # Input directory containing unmapped CRAMs (from Module 2)
# - vironator_out_dirname: "{dataset}_{genome_build}_vironator"      # Output directory for viral alignment CRAMs (defined in header)
# - vironator_jobexec_dirname: "jobexec_vironator_{dataset}_{genome_build}" # Jobexec orchestration directory (defined in header)
# - samples_list: "samples_SSC_hg38_extended.txt"                    # Sample list containing SAMPLE or PHASE+PROJECT+SAMPLE tokens
# - ref_dir: "/mnt/disks/staff/refs"                                 # Mount point for reference FASTA databases and BED files
# - scripts_dir: "/mnt/disks/staff/scripts"                          # Mount point for helper scripts (init_ref.sh, etc.)

# Alignment References and Databases (relative to ref_dir /mnt/disks/staff/refs/)
ref_cram_decoder: "GRCh38_full_analysis_set_plus_decoy_hla.fa" # Reference FASTA used to decode input CRAM
# ref_cram_decoder: "/mnt/disks/staff/refs/hs37d5.fa"
ref_human_full: "GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa"
ref_human_no_ebv: "GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified.renamed.fa"
ref_viral_base: "HumanViral_Reference_02-07-2022_modified.renamed.fa"
ref_plasmids: "SnapGene_modified.renamed.fa"
ref_mouse: "mm39_modified.renamed.fa"
ref_vir_cont: "HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified.fa"
ref_combined_default: "combined_GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified.fa"
ref_decoy: "GRCh38_Decoy_Reference_4-30-2019_modified.renamed.fa"
ref_rna: "GRCh38_RNA_Reference_4-30-2019_modified.renamed.fa"

# Reference metadata filenames (stored directly in ref_dir /mnt/disks/staff/refs/)
viral_contigs_file: "HumanViral_Reference_02-07-2022_modified.renamed.contigs.txt"
viral_bed_file: "HumanViral_Reference_02-07-2022_modified.renamed.bed"
plasmid_contigs_file: "SnapGene_modified.renamed.contigs.txt"
mouse_contigs_file: "mm39_modified.renamed.contigs.txt"

# Tool paths and script names (scripts are stored in scripts_dir)
bwa_bin: "/mnt/disks/staff/bin/bwa"
bwa_threads: 32        # Number of CPU threads per BWA alignment process (e.g. 16, 20, 32, 64)
# bwa_threads: 64      # High-performance BWA alignment on 128-core node
# bwa_threads: 96      # Maximum performance for BWA on 128-core node (leaves headroom for OS/IO)
samtools_threads: 16   # Number of CPU threads per samtools sort/view/fastq/index operation (e.g. 4, 8, 16, 24)
# samtools_threads: 24 # High-throughput samtools on 128-core node
# samtools_threads: 32 # Maximum throughput for samtools (above 32 threads, disk I/O & BAM compression saturate)
python_bin: "python3"
init_ref_script: "init_ref.sh"
combined_refs_dir: ""  # Output folder for combined reference (resolves directly to ref_dir)

# Alignment execution switches ("on" or "off")
align_and_filter: "off"
align_only: "off"
filter_only: "off"
dual_mode: "off"  # "on" to output BOTH clean (subtracted) and raw (unsubtracted) viral CRAMs; "off" for clean only


# ==============================================================================
# MODULE 4: REPORTING MODULE (Viral Quantification & Consolidated Multi-Source Report)
# ==============================================================================
reporting_module: "off"  # Switch: "on" or "off" master switch for reporting module

# Header Variables Used in Reporting Module:
# - dataset: "SSC"
# - genome_build: "hg38"
# - phase: ""                                                        # Set to "" if phase is specified in sample list tokens (e.g. 1+SSC+sample)
# - project: ""                                                      # Set to "" if project is specified in sample list tokens
# - output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"     # Destination bucket for reports & logs (mounts to output_dir)
# - output_dir: "/mnt/disks/staff"
# - vironator_out_dirname: "{dataset}_{genome_build}_vironator"      # Input directory containing viral alignment CRAMs (from Module 3)
# - reports_out_dirname: "{dataset}_{genome_build}_reports"          # Output directory for per-sample viral TSV reports (defined in header)
# - reporting_jobexec_dirname: "jobexec_reporting_{dataset}_{genome_build}" # Jobexec orchestration directory (defined in header)
# - samples_list: "samples_SSC_hg38_extended.txt"                    # Sample list containing SAMPLE or PHASE+PROJECT+SAMPLE tokens
# - ref_dir: "/mnt/disks/staff/refs"                                 # Mount point for reference FASTA databases, BED files, and metadata
# - scripts_dir: "/mnt/disks/staff/scripts"                          # Mount point for helper scripts (generate_report.py, etc.)
# - machine_type: "n1-standard-4"                                    # VM instance type for reporting job execution

# ------------------------------------------------------------------------------
# Submodule 4A: Database Taxonomy Index Builder
# Note: Run ONCE per reference database release (indexes all accessions for the database; no sample list required).
# ------------------------------------------------------------------------------
make_taxonomy_index_submodule: "off"                      # Switch: "on" or "off"
viral_database_file: "HumanViral_Reference_02-07-2022_modified.renamed.fa" # Target Viral Reference Database FASTA file (in ref_dir)
# Note: {db_name} is dynamically derived by trimming .fa / .fasta extension from viral_database_file above.
taxonomy_index_file: "{db_name}_taxonomy_index.tsv"        # Generated 14-column taxonomy index TSV file name

# ------------------------------------------------------------------------------
# Submodule 4B: Master Sample Report Generator
# Note: Parallel cluster batch execution iterating over sample lists.
# ------------------------------------------------------------------------------
generate_report_submodule: "off"                          # Switch: "on" or "off"

# Input Metadata / Coverage File (stored in ref_dir /mnt/disks/staff/refs/):
# - Option A (Standard: when Module 1 was run): use the master coverage TSV containing read depth:
sample_metadata_file: "{dataset}_{genome_build}_master_coverage.tsv"
# - Option B (Direct metadata: when skipping Module 1): point directly to your metadata TSV:
# sample_metadata_file: "{dataset}_{genome_build}_metadata.tsv"

# Column names in sample_metadata_file used for cumulative sample matching:
# (Defaults to sample_id_column, phase_column, project_column configured in Module 1, or override specifically for reporting here):
reporting_sample_id_column: "sample"                      # Column name for sample ID (e.g. "sample", "sample_name", "sscID")
reporting_phase_column: "phase"                           # Column name for phase (e.g. "phase")
reporting_project_column: "project"                       # Column name for project (e.g. "project")
# Note: The reporting script checks these configured column names FIRST, with built-in fallbacks if omitted:
# - Sample ID: matches reporting_sample_id_column -> "sample", "sample_name", "sample_id", "sscid", "id"
# - Coverage: auto-detects "coverage", "mean_coverage", "depth", "read_depth", "mean_depth", "wgs_coverage"
# - Genome Size: auto-detects "human_genome_size", "genome_size", "ref_len", "total_ref_length"

viral_rename_map_file: "{db_name}_map.tsv"                 # Generated by rename_fasta_contigs.sh (.renamed_map.tsv)
viral_bed_file: "{db_name}.bed"                            # Generated automatically during reference sanitization
report_script: "generate_report.py"

# Spatial Coverage & Entropy Metrics Configuration
enable_spatial_coverage_metrics: "on"                     # Switch: "on" or "off"
coverage_nbins: 10                                        # Number of spatial percentile bins per virus (default: 10)
min_genome_length_for_binning: 1000                       # Minimum viral length threshold in bp required to split into bins (default: 1000)
coverage_breadth_bin_threshold: 0.10                      # Mean depth threshold for viral_breadth_bin_frac (default: 0.10)
coverage_flat_bin_threshold: 10.0                         # Percentage threshold of bases covered per bin for viral_flat_bin_frac (default: 10.0%)

# Note: Combine all individual sample TSV reports into a final master report named as
# {dataset}_{genome_build}_master_report.tsv and place it in /mnt/disks/staff/refs/.
# This file is required by Module 5 (Stats), Module 6 (Distributions), and Module 8 (Refinement).


# ==============================================================================
# MODULE 5: UNIFIED STATS & VISUALIZATIONS MODULE
# ==============================================================================
stats_module: "off"  # Switch: "on" or "off" to run cohort stats summary & plots
master_report_file: "{dataset}_{genome_build}_master_report.tsv"  # Input master report file
viral_short_names_file: "HumanViral_Reference_02-07-2022_modified.renamed_map_short.tsv"   # Short virus abbreviations map in ref_dir (optional)
stats_out_dirname: "{dataset}_{genome_build}_stats"
plots_out_dirname: "{dataset}_{genome_build}_plots"
stats_script: "generate_stats.py"

# Scope & Strategy Selection:
stats_cohort_scope: "both"                                    # "both" (combined + all subsets), "combined_all", or "subsets_only"
stats_target_phase: ""                                        # Phase filter (e.g. "phase2", "panviral", or "" for auto-detect/all)
stats_target_project: ""                                      # Project filter (e.g. "base", or "" for auto-detect/all)

# Target Strategy (With vs. Without Flags):
stats_target_strategy: "exogeneSR_viral_clean_filtered.sorted.flags.cram"   # With flags
# stats_target_strategy: "exogeneSR_viral_clean_filtered.sorted.cram"       # Without flags

# Sample Label Filtering (Cohort comparison before and after exclusions):
stats_filter_labels_file: ""                                  # Optional file (e.g. "sorted.labels.txt") to filter samples; "" for none
stats_generate_filtered_set: "off"                            # "on" to generate both ..._all_samples_... and ..._clean_samples_... outputs

# ------------------------------------------------------------------------------
# Submodule 5.1: Core Summary Tables & Reports
# ------------------------------------------------------------------------------
enable_summary_tables: "on"                                   # Switch: "on" or "off"

# ------------------------------------------------------------------------------
# Submodule 5.2: Taxonomic Distribution & Landscape Plots
# ------------------------------------------------------------------------------
enable_taxonomy_plots: "on"                                   # Switch: "on" or "off"
stats_taxonomic_group_level: "species"                        # Primary group rank: "species", "genus", "family", "order", "realm", "accession"
taxonomy_stratify: "off"                                      # "on" to stratify taxonomy plots by demographic variable
enable_broken_axis_taxonomy: "on"                             # "on" to generate broken-axis plots alongside standard non-broken plots
enable_family_background_overlay: "on"                        # "on" to draw translucent tinted rectangles grouping genera into families
sample_enrichment_plots: "on"                                 # "on" to generate sample enrichment overlay plots (all_samples & clean_samples)

# ------------------------------------------------------------------------------
# Submodule 5.3: Cohort Demographics Plots (Prioritized from OLD script)
# ------------------------------------------------------------------------------
enable_demographics_plots: "on"                               # Switch: "on" or "off" (strictly without broken axes)

# ------------------------------------------------------------------------------
# Submodule 5.4: Abundance & Multi-Virus Density Distributions (Merged from Mod 7)
# ------------------------------------------------------------------------------
enable_abundance_distributions: "on"                          # Switch: "on" or "off"
reads_panel_a_loglog: "on"                                    # Log-log scale for Reads Panel A
reads_panel_b_log_y: "on"                                     # Log-Y scale for Reads Panel B
log_scale_read_cutoff: 30                                     # Threshold to trigger log scale for read counts (default: 30)
copy_number_panel_a_loglog: "on"                              # Log-log scale for Copy Number Panel A
copy_number_panel_b_log_y: "on"                               # Log-Y scale for Copy Number Panel B
log_scale_copy_number_cutoff: 0.1                             # Threshold to trigger log scale for copy numbers (default: 0.1)
enable_multi_virus_density_plot: "on"                         # "on" to output ..._copy_number_multi_density.tiff
multi_density_top_n_viruses: 15                               # Max top viruses to render (0 for all)
multi_density_x_scale: "log"                                  # "log" or "linear" for copy number X-axis
prelim_prevalence_cutoff_pct: 5.0                             # Prevalence % cutoff differentiating noise vs virome/infection
prelim_mean_read_cutoff: 6.0                                  # Mean read count cutoff differentiating noise vs virome/infection

# ------------------------------------------------------------------------------
# Submodule 5.5: Cross-Sample Heatmaps & Ubiquitous Virus Reporting
# ------------------------------------------------------------------------------
enable_heatmaps: "on"                                         # Switch: "on" or "off"
heatmap_read_counts: "off"                                    # Switch: "on" or "off" for read counts heatmap
heatmap_copy_number: "off"                                    # Switch: "on" or "off" for copy number heatmap
heatmap_min_reads_cutoff: 3                                   # Min reads threshold for heatmap inclusion
heatmap_stratify_by: ""                                       # Demographics column to split heatmaps by (e.g., "sex", "phenotype", "")
heatmap_exclude_viruses: []                                   # List of accessions to exclude (e.g. ["NC_001806.2", "NC_007605.1"])

# ------------------------------------------------------------------------------
# Submodule 5.6: Spatial Uniformity & Entropy Plots
# ------------------------------------------------------------------------------
enable_spatial_entropy_plots: "on"                            # Switch: "on" or "off"
enable_entropy_boxplot_h: "on"                                # Outputs ..._shannon_entropy_H.tiff (multi-virus comparative boxplot)
enable_evenness_boxplot_j: "on"                               # Outputs ..._pielou_evenness_J.tiff
enable_evenness_vs_breadth_scatter: "on"                      # Evenness (J) vs. Physical Breadth 2D scatter

# ------------------------------------------------------------------------------
# Submodule 5.7: Coverage Depth, Hotspots & Artifact Exclusion (Saved in coverage_plots/)
# ------------------------------------------------------------------------------
enable_coverage_qc_plots: "on"                                # Switch: "on" or "off"
coverage_artifact_peak_fold_threshold: 5.0                   # Bin mean depth > 5x genome-wide median triggers artifact flag
coverage_artifact_min_sample_recurrence: 3                    # Detected in >= 3 samples to be flagged as cohort artifact region
per_sample_coverage_plots: "on"                               # "on" to generate individual sample raw + binned dual-panel plots



# ==============================================================================
# MODULE 6: DISTRIBUTIONS MODULE (Per-Virus Read Distribution TIFF Plots & Virus Stats)
# ==============================================================================
distributions_module: "off"  # Switch: "on" or "off" to generate TIFF plots & virus stats
master_report_file: "{dataset}_{genome_build}_master_report.tsv"  # Input TSV report file used for distributions & stats
plots_out_dirname: "{dataset}_{genome_build}_plots"
stats_out_dirname: "{dataset}_{genome_build}_stats"
distributions_script: "generate_distributions.py"
target_strategy_type: "clean_flags"  # Options: "clean_flags" or "clean_filtered"
target_strategies:
  - "exogeneSR_viral_clean_filtered.sorted.flags.cram"

# Cohort Scope Options:

# Minimum total mapped reads threshold for rendering per-virus TIFF plots:
#   min_total_reads_to_plot: 3 (Skips plotting viruses with only 1 single read pair / <=2 reads)
#   min_max_reads_to_plot  : 3 (Skips plotting viruses where every single positive sample has <= 2 reads)
#   Note: All viruses remain 100% recorded in summary TSV tables regardless of this setting!
min_total_reads_to_plot: 3
min_max_reads_to_plot: 3

# Preliminary Classification Cutoffs:
#   prelim_prevalence_cutoff_pct : 5.0 (Prevalence % cutoff differentiating noise/infection from systematic/virome)
#   prelim_mean_read_cutoff      : 6.0 (Mean read count per sample cutoff differentiating noise vs virome/infection)
#   Classes:
#     - "sporadic_noise"  : Prevalence < 5% AND Mean Reads <= 6.0 (NOT plotted)
#     - "systematic_noise": Prevalence >= 5% AND Mean Reads <= 6.0 (Plotted)
#     - "virome"          : Prevalence >= 5% AND Mean Reads > 6.0 (Plotted)
#     - "infection"       : Prevalence < 5% AND Mean Reads > 6.0 (Plotted)
prelim_prevalence_cutoff_pct: 5.0
prelim_mean_read_cutoff: 6.0

# Read count threshold to trigger Log-Scale transformations in Panels A and B:
#   log_scale_read_cutoff: 30 (Reads <= 30 use Linear scale; Reads > 30 use Log-Log/Log-Y)
log_scale_read_cutoff: 30

strategy_colors:
  clean_filtered: "#ff98ff"
  clean_flags: "#ff98ff"
  overall: "#008fbf"

# ==============================================================================
# MODULE 7: FLAG COMPARISON & DIFFERENCE MODULE
# ==============================================================================
flag_comparison_module: "off"                       # Switch: "on" or "off" to run sequential flag difference extraction
flag_difference_script: "generate_flag_difference_crams.py"

# Output Directory Configuration:
# - comparison_out_dirname: Directory name where comparison mini-reports & TSV tables are saved
comparison_out_dirname: "{dataset}_{genome_build}_comparisons"

# Flag CRAM Targets:
cram_noflags_file: "exogeneSR_viral_clean_filtered.sorted.cram"
cram_flags_file: "exogeneSR_viral_clean_filtered.sorted.flags.cram"
cram_additional_file: "exogeneSR_viral_clean_filtered.sorted.flags.additional.cram"

# Input TSV File Configuration:
# - custom_input_tsv_provided: "yes" or "no"
#   If "yes": Uses custom_input_tsv_path (4-column difference TSV: sample, virus, flags-noflags, difference)
#   If "no" : Uses master_report_file copied into local VIROnator repository directory.
master_report_file: "{dataset}_{genome_build}_master_report.tsv"
custom_input_tsv_provided: "no"
custom_input_tsv_path: "flag_difference_input.tsv"


# ==============================================================================
# MODULE 8: REFINEMENT MODULE (NCBI RefSeq Strain Resolution & Species Collapse)
# ==============================================================================
refinement_module: "off"                 # Master switch: "on" or "off"


# Stage-by-Stage Sub-Switches:
make_taxonomy_index_stage: "off"         # Stage 1: Build 14-column taxonomy index TSV
ncbi_download_stage: "off"               # Stage 2: Download complete RefSeq genomes from NCBI
build_combined_ref_stage: "off"          # Stage 3: Merge references & run bowtie2-build
refinement_alignment_stage: "off"        # Stage 4: Run Bowtie2 alignment, filter & report

# Input Files & Output Locations:
db_fasta_file: "HumanViral_Reference_02-07-2022.fa"   # Source viral database FASTA for taxonomy index
master_report_file: "{dataset}_{genome_build}_master_report.tsv"
taxonomy_index_file: "{db_name}_taxonomy_index.tsv"        # 14-column taxonomy index TSV file in ref_dir
refinement_samples_list: "config/refinement_samples.tsv" # Sample list TSV (sample, phase, project)

# Reference & Output Storage Paths (under /mnt/disks/staff/refs/):
ref_human_full: "GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa" # Sanitized Human Genome
ref_mouse: "mm39_ms_modified.fa"                             # Sanitized Mouse Genome
ref_plasmids: "SnapGene_plasmids_modified.fa"                 # Sanitized Plasmid / Vector Set
ncbi_taxdump_dir: "/mnt/disks/staff/refs/ncbi_taxdump"   # Storage for nodes.dmp, names.dmp, accession2taxid
ncbi_download_dir: "/mnt/disks/staff/refs/ncbi_download" # Storage for downloaded RefSeq FASTA genomes
refinement_combined_ref_file: "combined_human_mouse_plasmids_refinement_viral_2026-08-29.fa"

# Tool Binary Paths:
bowtie2_bin: "/mnt/disks/staff/bin/bowtie2"
bowtie2_build_bin: "/mnt/disks/staff/bin/bowtie2-build"

# Algorithmic & Output Settings:
ncbi_download_rank: "species"           # Taxonomic rank for NCBI query: "species" or "genus"
refinement_out_dirname: "{dataset}_{genome_build}_refinement"
refinement_jobexec_dirname: "jobexec_refinement_{dataset}_{genome_build}"
refinement_strategy: "clean"            # Candidate read source strategy: "clean" or "raw"
bowtie2_max_multimaps: 10               # -k flag for Bowtie2 multimapping alignment


# ==============================================================================
# MODULE 10: DISCORDANT READS & VIRAL INTEGRATION BREAKPOINTS
# ==============================================================================
discordant_module: "off"                 # Master switch: "on" or "off"
discordant_script: "extract_discordant_integrations.py"
discordant_input_strategy: "exogeneSR_viral_clean.cram" # Target unfiltered CRAM file (exogeneSR_viral_clean.cram or exogeneSR_viral_raw.cram)
discordant_out_dirname: "{dataset}_{genome_build}_breakpoints"
discordant_jobexec_dirname: "jobexec_discordant_{dataset}_{genome_build}"

# Reference Contigs & Annotations:
human_contigs_file: "GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.contigs.txt" # List of valid human contigs in ref_dir
viral_contigs_file: "HumanViral_Reference_02-07-2022_modified.renamed.contigs.txt"           # List of valid viral contigs in ref_dir
human_gene_annotation_file: "gencode.v38.annotation.genes.bed"                               # Human gene annotation BED file in ref_dir (auto-downloaded if absent)

# Quality & Filtering Criteria:
discordant_min_mapq: 20                  # Min MAPQ for both mates of discordant pairs
discordant_min_aligned_len: 35           # Min aligned length (bp) for discordant read metrics
softclip_min_primary_mapq: 10            # Min MAPQ for split read primary alignment
softclip_min_sa_mapq: 10                 # Min MAPQ for split read supplementary (SA) cross-species alignment
softclip_min_clip_len: 25                # Min length (bp) for split portion

# Clustering & Breakpoint Thresholds (Rightward Sliding Window - Seed / Anchor Approach):
integration_cluster_window: 500          # Window size in bp (extends rightward from seed read)
integration_min_support_reads: 2         # Min total supporting reads (discordant + split) to report locus

# Plotting Settings:
plot_integration_plots: "on"             # Switch: "on" or "off" for Dual Genomic Arc / locus coverage plots
plot_min_support_reads: 3                # Min reads threshold to trigger locus plot
plot_top_loci_count: 5                   # Maximum top candidate loci to plot per sample












