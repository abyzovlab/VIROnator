# ==============================================================================
# 1. COMMON / JOINT VARIABLES (Global parameters used across modules)
# ==============================================================================
lab_dir: "/mnt/disks/lab"
staff_dir: "/mnt/disks/staff"
work_dir: "/home/ext_djonovic_milana_mayo_edu/VIROnator"
placeholder_file: "test.txt"

# Google Cloud Storage (GCS) Buckets
# - lab_bucket: Source bucket where raw CRAM files are stored (mounts to /mnt/disks/lab)
# - staff_bucket: Destination bucket where outputs are deposited (mounts to /mnt/disks/staff)
lab_bucket: "ml-phi-abyzov-alexej-m124423-rsa-us-central1-p-d3c4"
staff_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"

# GCS output folder names (located inside staff_dir)
unmapped_out_dirname: "SSC_hg38_unmapped"
vironator_out_dirname: "SSC_hg38_vironator"

# Module-specific metadata (Project-level configuration)
module: "SSC"
phase: "2"
project: ""

# Path to the sample metadata list
samples_list: "../samples_p2_base"

# Base directory for all external reference genomes (GCS mount)
ref_dir: "/mnt/disks/staff/refs"

# Repository directory containing helper scripts
scripts_dir: "scripts"

# Repository directory containing database interval and contig lists
db_metadata_dir: "config/db_metadata"


# ==============================================================================
# 2. UNMAPPED EXTRACTION MODULE
# ==============================================================================
unmapped_extraction: "on"  # Switch: "on" or "off"

# Extraction References
# For SSC, this uses the modified GRCh38 full analysis set
ref_genome: "/mnt/disks/staff/refs/GRCh38_full_analysis_set_plus_decoy_hla_modified.fa"


# ==============================================================================
# 3. VIRAL DB ALIGNMENT MODULE (VIROnator)
# ==============================================================================
viral_db_alignment: "on"  # Switch: "on" or "off"

# Alignment References and Databases (relative to ref_dir)
ref_human_no_ebv: "GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified.fa"
ref_human_full: "GRCh38_full_analysis_set_plus_decoy_hla_modified.fa"
ref_viral: "HumanViral_Reference_02-07-2022_SnapGene_plasmids.modified_mm39_ms.fa"
ref_combined_default: "combined_GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified_plus_HumanViral_Reference_02-07-2022_SnapGene_plasmids.modified_mm39_ms.fa"
ref_decoy: "GRCh38_Decoy_Reference_4-30-2019.fa"
ref_rna: "GRCh38_RNA_Reference_4-30-2019.fa"

# Reference metadata filenames (stored in config/db_metadata/)
viral_contigs_file: "HumanViral_Reference_02-07-2022_contigs.fa"
viral_bed_file: "HumanViral_Reference_02-07-2022.bed"

# Tool paths and script names (scripts are stored in scripts_dir)
bwa_bin: "/Users/djonovic.milana/miniconda3/envs/vironator/bin/bwa"
init_ref_script: "init_ref.sh"
combined_refs_dir: "."  # Output folder for combined reference (resolves directly to ref_dir)

# Alignment controls
alignment_mode: "align_and_filter"  # "align_and_filter" or "filter_only"
