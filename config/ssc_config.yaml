# ==============================================================================
# DATASET & GENOME BUILD METADATA (Project-level configuration)
# ==============================================================================
dataset: "SSC"
genome_build: "hg38"
build: "hg38"
phase: "2"
project: ""

# ==============================================================================
# COMMON / JOINT VARIABLES (Global parameters used across modules)
# ==============================================================================
data_dir: "/mnt/disks/lab"
data_subdir: "tertiary/{dataset}_{build}/WGS"  # Middle subdirectory path inside data_dir (set to "" for flat datasets)
input_keyword: "final"                 # Optional middle keyword after sample dot (e.g. "final", "sorted", or "" for none)
input_suffix: "cram"                   # File extension after keyword (e.g. "cram", "bam")
output_dir: "/mnt/disks/staff"
work_dir: "."  # Current VIROnator execution directory
placeholder_file: "test.txt"

# Google Cloud Storage (GCS) Buckets
# - data_bucket: Source GCS bucket where raw CRAM files are stored (mounts to /mnt/disks/lab)
# - output_bucket: Destination GCS bucket where outputs are deposited (mounts to /mnt/disks/staff)
data_bucket: "ml-phi-abyzov-alexej-m124423-rsa-us-central1-p-d3c4"
output_bucket: "ml-phi-staff-m277455-p-rsa-us-central1-p-a3d4"

# GCP Service Account & Billing Parameters
gcp_account: "vaults6-m277455-p-1733249128@ml-fpt-rsa-aproject1-p-581c.iam.gserviceaccount.com"
pi: "MDJ"
pau: 0
task_name: "mdj_test"

# GCS output folder names (located inside output_dir)
unmapped_out_dirname: "{dataset}_{build}_unmapped"
vironator_out_dirname: "{dataset}_{build}_vironator"
reports_out_dirname: "{dataset}_{build}_reports"

# Jobexec orchestrator folder names (located in output_bucket)
unmapped_jobexec_dirname: "jobexec_unmapped_{dataset}_{build}"
vironator_jobexec_dirname: "jobexec_vironator_{dataset}_{build}"
reporting_jobexec_dirname: "jobexec_reporting_{dataset}_{build}"

# Path to the sample metadata list.
# - If you specify a RELATIVE path (e.g., "samples_p2_base"), Snakemake dynamically 
#   appends it to the "work_dir" configured above (e.g. work_dir/samples_p2_base).
# - If your samples file is stored elsewhere, you MUST provide an ABSOLUTE path 
#   starting with a "/" (e.g. "/home/user/working/samples_p2_base") to bypass 
#   automatic appending.
samples_list: "samples_p2_base_test"

# Base directory for all external reference genomes (GCS mount)
ref_dir: "/mnt/disks/staff/refs"

# Repository directory containing helper scripts (GCS shared mount)
scripts_dir: "/mnt/disks/staff/scripts"


# ==============================================================================
# MODULE 1: COVERAGE CALCULATION MODULE (WGS Human Genome Read Depth)
# ==============================================================================
coverage_module: "off"  # Switch: "on" or "off" to run coverage calculation job
coverage_out_dirname: "{dataset}_{build}_coverage"
coverage_jobexec_dirname: "jobexec_coverage_{dataset}_{build}"


# ==============================================================================
# MODULE 2: UNMAPPED EXTRACTION MODULE (Phase 1 CRAM Candidate Extraction)
# ==============================================================================
unmapped_extraction: "off"  # Switch: "on" or "off" to run/skip Phase 1 extraction

# Extraction References
ref_genome: "/mnt/disks/staff/refs/GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa"


# ==============================================================================
# MODULE 3: VIRAL DB ALIGNMENT MODULE (VIROnator)
# ==============================================================================
viral_db_alignment: "off"  # Switch: "on" or "off"
contamination_quantification: "off"  # Switch: "on" to blacklist plasmid/mouse reads from viral BAM & output 3-column .count TSVs

# Alignment References and Databases (relative to ref_dir /mnt/disks/staff/refs/)
ref_cram_decoder: "GRCh38_full_analysis_set_plus_decoy_hla.fa"  # Original reference for CRAM decoding
ref_human_full: "GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa"
ref_human_no_ebv: "GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified.renamed.fa"
ref_viral_base: "HumanViral_Reference_02-07-2022_modified.renamed.fa"
ref_plasmids: "SnapGene_modified.renamed.fa"
ref_mouse: "mm39_modified.renamed.fa"
ref_vir_cont: "HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified.fa"
ref_combined_default: "combined_GRCh38_full_analysis_set_plus_decoy_hla_no_ebv_modified_HumanViral_Reference_02-07-2022_modified_SnapGene_modified_mm39_modified.fa"
ref_decoy: "GRCh38_Decoy_Reference_4-30-2019_modified.renamed.fa"
ref_rna: "GRCh38_RNA_Reference_4-30-2019_modified.renamed.fa"

# Reference metadata filenames (stored directly in ref_dir /mnt/disks/staff/refs/)
viral_contigs_file: "HumanViral_Reference_02-07-2022_modified.renamed.contigs.txt"
viral_bed_file: "HumanViral_Reference_02-07-2022_modified.renamed.bed"
plasmid_contigs_file: "SnapGene_modified.renamed.contigs.txt"
mouse_contigs_file: "mm39_modified.renamed.contigs.txt"

# Tool paths and script names (scripts are stored in scripts_dir)
bwa_bin: "/mnt/disks/staff/bin/bwa"
bowtie2_bin: "/mnt/disks/staff/bin/bowtie2"
bowtie2_build_bin: "/mnt/disks/staff/bin/bowtie2-build"
python_bin: "python3"
init_ref_script: "init_ref.sh"
combined_refs_dir: ""  # Output folder for combined reference (resolves directly to ref_dir)

# Alignment execution switches ("on" or "off")
align_and_filter: "off"
align_only: "off"
filter_only: "off"
dual_mode: "off"  # "on" to output BOTH clean (subtracted) and raw (unsubtracted) viral CRAMs; "off" for clean only


# ==============================================================================
# MODULE 4: REPORTING MODULE (Viral Quantification & Consolidated Multi-Source Report)
# ==============================================================================
reporting_module: "off"  # Switch: "on" or "off"

# Metadata and Reference Annotations (stored directly in ref_dir /mnt/disks/staff/refs/)
sample_metadata_file: "{dataset}_{build}_master_coverage.tsv"
viral_rename_map_file: "HumanViral_Reference_02-07-2022_modified.rename_map.tsv"  # Generated by rename_fasta_contigs.sh (sanitized using the -ncbi argument)
viral_bed_file: "HumanViral_Reference_02-07-2022_modified.bed"  # Generated automatically during the reference sanitization script
report_script: "generate_report.py"


# ==============================================================================
# MODULE 5: STATS MODULE (Cohort Statistical Summary Snapshot)
# ==============================================================================
stats_module: "off"  # Switch: "on" or "off" to run cohort stats summary
master_report_file: "master_all_cohorts_viral_report_final.tsv"  # Input master report file
stats_script: "generate_stats.py"


# ==============================================================================
# MODULE 6: DISTRIBUTIONS MODULE (Per-Virus Read Distribution TIFF Plots & Virus Stats)
# ==============================================================================
distributions_module: "off"  # Switch: "on" or "off" to generate TIFF plots & virus stats
master_report_file: "master_all_cohorts_viral_report_final.tsv"  # Input TSV report file used for distributions & stats
plots_out_dirname: "{dataset}_{build}_plots"
stats_out_dirname: "{dataset}_{build}_stats"
distributions_script: "generate_distributions.py"
target_strategy_type: "clean_flags"  # Options: "clean_flags" or "clean_filtered"
target_strategies:
  - "exogeneSR_viral_clean_filtered.sorted.flags.cram"

# Cohort Scope Options:
#   "target_only"  : Plot only the specific phase & project defined in config
#   "combined_all" : Aggregate ALL samples across ALL phases and ALL projects into unified plots/stats
#   "both"         : Generate both per-phase/project AND combined cohort-wide plots/stats
cohort_scope: "combined_all"

# Transformation Switches for Panels A and B:
#   panel_a_loglog: "on" or "off" (Triggers Log-Log scale for Panel A frequency histogram)
#   panel_b_log_y : "on" or "off" (Triggers Log-Scale Y-axis for Panel B rank-abundance curve)
panel_a_loglog: "on"
panel_b_log_y: "on"

# Minimum total mapped reads threshold for rendering per-virus TIFF plots:
#   min_total_reads_to_plot: 3 (Skips plotting viruses with only 1 single read pair / <=2 reads)
#   min_max_reads_to_plot  : 3 (Skips plotting viruses where every single positive sample has <= 2 reads)
#   Note: All viruses remain 100% recorded in summary TSV tables regardless of this setting!
min_total_reads_to_plot: 3
min_max_reads_to_plot: 3

# Preliminary Classification Cutoffs:
#   prelim_prevalence_cutoff_pct : 5.0 (Prevalence % cutoff differentiating noise/infection from systematic/virome)
#   prelim_mean_read_cutoff      : 6.0 (Mean read count per sample cutoff differentiating noise vs virome/infection)
#   Classes:
#     - "sporadic_noise"  : Prevalence < 5% AND Mean Reads <= 6.0 (NOT plotted)
#     - "systematic_noise": Prevalence >= 5% AND Mean Reads <= 6.0 (Plotted)
#     - "virome"          : Prevalence >= 5% AND Mean Reads > 6.0 (Plotted)
#     - "infection"       : Prevalence < 5% AND Mean Reads > 6.0 (Plotted)
prelim_prevalence_cutoff_pct: 5.0
prelim_mean_read_cutoff: 6.0

# Read count threshold to trigger Log-Scale transformations in Panels A and B:
#   log_scale_read_cutoff: 30 (Reads <= 30 use Linear scale; Reads > 30 use Log-Log/Log-Y)
log_scale_read_cutoff: 30

strategy_colors:
  clean_filtered: "#ff98ff"
  clean_flags: "#ff98ff"
  overall: "#008fbf"

# ==============================================================================
# MODULE 7: FLAG COMPARISON MODULE (SAM Flag Comparison for Clean Strategy)
# ==============================================================================
flag_comparison_module: "off"  # Switch: "on" or "off" to enable SAM flag comparison module
flag_comparison_out_dirname: "{dataset}_{build}_flag_comparison"
flag_comparison_jobexec_dirname: "jobexec_flag_comparison_{dataset}_{build}"
flag_comparison_script: "run_flag_comparison.py"

# ==============================================================================
# MODULE 8: REFINEMENT MODULE (NCBI RefSeq Strain Resolution & Species Collapse)
# ==============================================================================
refinement_module: "off"                 # Master switch: "on" or "off"

# Stage-by-Stage Sub-Switches:
make_taxonomy_index_stage: "off"         # Stage 1: Build 14-column taxonomy index TSV
ncbi_download_stage: "off"               # Stage 2: Download complete RefSeq genomes from NCBI
build_combined_ref_stage: "off"          # Stage 3: Merge references & run bowtie2-build
refinement_alignment_stage: "off"        # Stage 4: Run Bowtie2 alignment, filter & report

# Input Files & Output Locations:
db_fasta_file: "HumanViral_Reference_02-07-2022.fa"   # Source viral database FASTA for taxonomy index
master_report_file: "master_all_cohorts_viral_report_final.tsv"
taxonomy_index_file: "config/db_metadata/viral_reference_taxonomy_index.tsv"
refinement_samples_list: "config/refinement_samples.tsv" # Sample list TSV (sample, phase, project)

# Reference & Output Storage Paths (under /mnt/disks/staff/refs/):
ref_human_full: "GRCh38_full_analysis_set_plus_decoy_hla_modified.renamed.fa" # Sanitized Human Genome
ref_mouse: "mm39_ms_modified.fa"                             # Sanitized Mouse Genome
ref_plasmids: "SnapGene_plasmids_modified.fa"                 # Sanitized Plasmid / Vector Set
ncbi_taxdump_dir: "/mnt/disks/staff/refs/ncbi_taxdump"   # Storage for nodes.dmp, names.dmp, accession2taxid
ncbi_download_dir: "/mnt/disks/staff/refs/ncbi_download" # Storage for downloaded RefSeq FASTA genomes
refinement_combined_ref_file: "combined_human_mouse_plasmids_refinement_viral_2026-08-29.fa"

# Algorithmic & Output Settings:
ncbi_download_rank: "species"           # Taxonomic rank for NCBI query: "species" or "genus"
refinement_out_dirname: "{dataset}_{build}_refinement"
refinement_jobexec_dirname: "jobexec_refinement_{dataset}_{build}"
refinement_strategy: "clean"            # Candidate read source strategy: "clean" or "raw"
bowtie2_max_multimaps: 10               # -k flag for Bowtie2 multimapping alignment



